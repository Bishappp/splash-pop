const GAME_TITLE='SPLASH POP';

/* ---------- utils ---------- */
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[ri(0,a.length-1)];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rect(x,a,b,w,h,c){x.fillStyle=c;x.fillRect(a|0,b|0,Math.max(0,w|0),Math.max(0,h|0))}
function disc(x,cx,cy,r,c){x.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j+r*0.6));x.fillRect(cx-w,cy+j,w*2+1,1)}}
function ditherDisc(x,cx,cy,r,c){x.fillStyle=c;cx|=0;cy|=0;r|=0;for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j));for(let i=-w;i<=w;i++)if(((i+j)&1)===0)x.fillRect(cx+i,cy+j,1,1)}}
function grad(x,y0,y1,cols){const n=cols.length,hh=(y1-y0)/n;for(let i=0;i<n;i++){const a=Math.round(y0+i*hh),b=Math.round(y0+(i+1)*hh);x.fillStyle=cols[i];x.fillRect(0,a,W,b-a);if(i<n-1){x.fillStyle=cols[i+1];for(let yy=b-3;yy<b;yy++){const st=yy===b-1?2:4;for(let xx=(yy&1)*(st>>1);xx<W;xx+=st)x.fillRect(xx,yy,1,1)}}}}
function tri(x,cx,top,base,hw,c){x.fillStyle=c;top|=0;base|=0;for(let y=top;y<=base;y++){const w=Math.round((y-top)/Math.max(1,base-top)*hw);x.fillRect(Math.round(cx-w),y,w*2+1,1)}}
function mkSpr(rows,pal){const h=rows.length,w=Math.max(...rows.map(r=>r.length)),c=mk(w,h),x=c.getContext('2d');for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const col=pal[rows[j][i]];if(!col)continue;x.fillStyle=col;x.fillRect(i,j,1,1)}return c}
function flip(s){const c=mk(s.width,s.height),x=c.getContext('2d');x.translate(s.width,0);x.scale(-1,1);x.drawImage(s,0,0);return c}
const rev=s=>s.split('').reverse().join('');
function setc(rows,x,y,ch){rows[y]=rows[y].substring(0,x)+ch+rows[y].substring(x+1)}

/* ---------- text ---------- */
function txt(s,x,y,col='#fff',size=8,align='left',ol='#1a1020'){
  ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';x=Math.round(x);y=Math.round(y);
  if(ol){ctx.fillStyle=ol;const o=size>=16?2:1;for(const[dx,dy]of[[-o,0],[o,0],[0,-o],[0,o],[o,o],[-o,o],[o,-o],[-o,-o],[0,o+1],[o,o+1]])ctx.fillText(s,x+dx,y+dy)}
  ctx.fillStyle=col;ctx.fillText(s,x,y)}

/* ---------- герой (чиби, как на рефе: большая голова) ---------- */
const HP={k:'#1a1020',C:'#ff3b4a',c:'#b0213a',w:'#ffffff',h:'#3b2416',s:'#f6bb8e',d:'#cf8963',g:'#0b0b12',l:'#7ff0ff',J:'#2ec4b6',j:'#1a8a80',T:'#f4f4f4',y:'#ffd23f',Y:'#d18a00',p:'#3c5fd6',q:'#24398f',n:'#ffffff',r:'#ff4f9a',o:'#ff8a1f',v:'#5be35b',L:'#d6ffd6'};
const HALF=[
".....kkkk","...kkCCCC","..kCCCCCC",".kCCCCCCC",".kCCCCCCC","kcccccccc","kkkkkkkkk",
".khhsssss",".khssssss","kgggggggg",".kglggggg",".kggggggs",".ksssssss",".ksssssss",
"..kdsssss","...kkddss","....kJJks","...kJJyTT","..kJjJJyT","..kJjJJTy","..ksjJJTT","..kskJJJJ"];
const mirror=rows=>rows.map(r=>r+rev(r));
const LEG_STAND=["....kppppqpppk....","....kppkkkkppk....","...knnnrkkrnnnk...","...kkkkkkkkkkkk..."];
const LEG_RUN=["....kppppqpppk....","...kppkk..kppk....","..knnnrk..knnrk...","..kkkkkk...kkkk..."];
function heroRows(dead){const top=mirror(HALF);setc(top,8,2,'w');setc(top,9,2,'w');setc(top,8,3,'w');setc(top,9,3,'w');
  setc(top,8,20,'Y');setc(top,9,20,'Y');
  if(dead){top[9]=mirror([".khssssss"])[0];top[10]=mirror([".ksskssss"])[0];top[11]=mirror([".ksssssss"])[0];setc(top,8,13,'k');setc(top,9,13,'k')}
  else{setc(top,8,13,'k');setc(top,9,13,'k');setc(top,10,13,'k');setc(top,11,12,'k')}
  return top}
const HERO={};
{const T=heroRows(false),D=heroRows(true);
 for(const[k,rows]of Object.entries({stand:T.concat(LEG_STAND),run1:T.concat(LEG_RUN),run2:T.concat(LEG_RUN.map(rev)),dead:D.concat(LEG_STAND)})){const s=mkSpr(rows,HP);HERO[k]=[s,flip(s)]}}
const HW=18,HH=26;
const GUN=mkSpr(["..kk..",".kvvk.",".kook.","kvvvvk","kvLvvk","kvvvvk","kooook",".kook.","..kok.","..kkk."],HP);
const GLASSES=mkSpr(["kkkkkkkkkkkkk","kglgggkgglggk",".kgggk.kgggk."],HP);

/* ---------- предметы и враги ---------- */
const PINE=mkSpr(["..G.G..",".GgGgG.","..GGG..",".kkkkk.","kyYyYyk","kYyYyYk","kyYyYyk","kYyYyYk",".kyYyk.","..kkk.."],{G:'#4fd25f',g:'#2a8a3a',k:'#3a1a08',y:'#ffd23f',Y:'#e8901a'});
const SPP={k:'#120a12',m:'#4a2c55',R:'#ff2e3e'};
const SPIDER=[mkSpr(["k.......k",".k.kkk.k.","..kmmmk..","kkkRkRkkk","..kkkkk..",".k.k.k.k.","k..k.k..k"],SPP),
              mkSpr([".k.....k.","k..kkk..k",".kkmmmkk.","..kRkRk..","kkkkkkkkk","k.k...k.k","...k.k..."],SPP)];
const CRP={k:'#3a0a06',R:'#ff5a3a',r:'#b8321f',w:'#ffffff'};
const CRAB=[mkSpr(["kk.........kk","kRk.......kRk","kRRk.w.w.kRRk",".kRkkkkkkkRk.","..kRRRRRRRk..",".kRRrRRRrRRk.","kRRRRRRRRRRRk",".kkkkkkkkkkk.","k.k.k...k.k.k"],CRP),
            mkSpr(["...........kk",".kk.......kRk","kRRk.w.w.kRRk",".kRkkkkkkkRk.","..kRRRRRRRk..",".kRRrRRRrRRk.","kRRRRRRRRRRRk",".kkkkkkkkkkk.",".k.k.k.k.k.k."],CRP)];
const CYP={k:'#2a0806',R:'#d8442c',r:'#8a2418',w:'#ffffff',a:'#ffb08a'};
const CRAYR=[mkSpr(["............kk.","..........kkRRk","kkk......kRRRk.","kRRkkkkkkRRkk..",".kRRRRRRRRRRwk.","kRRrRrRrRRRRRRk",".kkkkkkkkkkkkk.","..k.k.k.k.k...."],CYP),
             mkSpr(["...........kk..",".........kkRRk.","kkk......kRRRk.","kRRkkkkkkRRkk..",".kRRRRRRRRRRwk.","kRRrRrRrRRRRRRk",".kkkkkkkkkkkkk.","...k.k.k.k.k..."],CYP)];
const CRAY=[CRAYR,CRAYR.map(flip)];
const JLP={k:'#7a2a8a',P:'#ff8ae0',p:'#ffd0f4',t:'#ffb0ec'};
const JELLY=[mkSpr(["...kkkkk...","..kPPPPPk..",".kPpPPPPPk.","kPpPPPPPPPk","kPPPPPPPPPk","kkkkkkkkkkk",".t.t.t.t.t.",".t..t.t..t.","..t.t.t.t..",".t..t..t.t.","..t..t..t.."],JLP),
             mkSpr(["...kkkkk...","..kPPPPPk..",".kPpPPPPPk.","kPpPPPPPPPk","kPPPPPPPPPk","kkkkkkkkkkk",".t.t.t.t.t.","t.t..t..t.t",".t.t.t.t.t.","..t..t..t..",".t..t..t..."],JLP)];
const CROWN=mkSpr(["y..y..y","yy.y.yy","yyyyyyy","yRyByRy"],{y:'#ffd23f',R:'#ff3b4a',B:'#2a8cff'});
const HALO=mkSpr(["..kkkkk..",".kyyyyyk.","kyY...Yyk",".kyyyyyk.","..kkkkk.."],{k:'#8a5a00',y:'#ffe066',Y:'#fff8c0'});
const CAP=mkSpr(["..kkkk...",".kCCwCk..","kCCCCCCk.","kccccccck",".kkkkkkk."],HP);
const ICO={dbl:mkSpr([".w...w.","www.www",".w...w.",".w...w.",".w...w.",".w...w.",".w...w."],{w:'#fff'}),
 frz:mkSpr(["...w...",".w.w.w.","..www..","wwwwwww","..www..",".w.w.w.","...w..."],{w:'#fff'})};
const POWC={dbl:'#2a8cff',frz:'#22c4e8'},POWN={dbl:'ДВЕ СТРУИ',frz:'ЗАМОРОЗКА'};
const EN={spider:{spr:()=>SPIDER,hw:4,hh:3,pts:300,hp:1},crab:{spr:()=>CRAB,hw:6,hh:4,pts:300,hp:1},cray:{spr:e=>CRAY[e.face>0?0:1],hw:7,hh:4,pts:400,hp:2},jelly:{spr:()=>JELLY,hw:5,hh:5,pts:350,hp:1}};
const BOSSN={crab:'КОРОЛЬ-КРАБ',spider:'ПАУК-ГИГАНТ',jelly:'МЕГА-МЕДУЗА',cray:'РАК-ГРОМИЛА'};
/* подарки */
const GIFTS=[['ЗОЛОТАЯ ЦЕПЬ','#ffd23f','#ff3b4a'],['НОВЫЕ ОЧКИ','#2a8cff','#ffffff'],['КРУТЫЕ КРОССЫ','#ff4f9a','#ffd23f'],['СУПЕР-ПИСТОЛЕТ','#5be35b','#ff8a1f'],['КЕПКА-РАДУГА','#ff3b4a','#2ec4b6'],
 ['СКЕЙТБОРД','#8e44e8','#5be35b'],['НАУШНИКИ','#1fd3f0','#ff3fa4'],['ГАВАЙСКАЯ РУБАХА','#ff8a1f','#2a8cff'],['КОКТЕЙЛЬ','#ffd21f','#8e44e8'],['РОЛИКИ','#2ec4b6','#ffd23f'],
 ['ПЛЕЙЕР','#e83b3b','#ffffff'],['ДОСКА ДЛЯ СЕРФА','#3fbf4f','#ff4f9a'],['БУМБОКС','#5a4a8c','#ffd23f'],['ЗОЛОТЫЕ ЧАСЫ','#d18a00','#ffffff'],['ЛИМУЗИН','#20202a','#ff3b4a'],
 ['ЯХТА','#ffffff','#2a8cff'],['ЗВЕЗДА','#ff3fa4','#ffe066'],['КОРОНА','#8e44e8','#ffe066'],['РАКЕТА','#ff5a3a','#ffffff'],['КУБОК ЧЕМПИОНА','#ffe066','#ff3b4a']];
const GIFT_ROWS=["..r.r..","...r...","bbbrbbb","BBBrBBB","BBBrBBB","BBBrBBB","BBBrBBB"];
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>clamp(Math.round(k>1?v+(255-v)*(k-1):v*k),0,255);return'#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const GIFT_SPR=GIFTS.map(([n,b,r])=>mkSpr(GIFT_ROWS,{B:b,b:shade(b,1.35),r}));
const GIFT_LOCK=mkSpr(GIFT_ROWS,{B:'#2e2350',b:'#3a2d5c',r:'#4a3a7a'});

/* ---------- шары ---------- */
const RAD=[14,10,6,4],VX=[34,38,42,46],PTS=[50,100,150,200],HFR=[0.72,0.55,0.38,0.24],GRAV=420;let BV=[0,0,0,0];
const BALLC={
 red:['#2a0612','#9e1631','#e8324c','#ff7d8a','#ffe0e4'],blue:['#08133a','#1d3fa8','#2f6cf0','#7fb0ff','#e6f0ff'],
 green:['#06280e','#16803a','#2fc457','#8cf09a','#effff0'],purple:['#1c0833','#5a1fa6','#8e44e8','#c79bff','#f5ecff'],
 orange:['#331100','#b04a08','#ff7a1a','#ffb46b','#fff0dc'],pink:['#33061f','#b0186e','#ff3fa4','#ff9bd2','#fff0f8'],
 yellow:['#2e2200','#b08a00','#ffd21f','#fff07a','#fffde6'],cyan:['#032a33','#0b8aa8','#1fd3f0','#8cf3ff','#effdff']};
const ballCache={};
function ballSpr(s,col){const key=s+col;if(ballCache[key])return ballCache[key];
  const r=RAD[s],d=r*2,c=mk(d,d),x=c.getContext('2d'),P=BALLC[col],B=[0,2,3,1],L=[-0.5,-0.62,0.6],ln=Math.hypot(...L);
  for(let j=0;j<d;j++)for(let i=0;i<d;i++){const dx=i+0.5-r,dy=j+0.5-r,ds=Math.hypot(dx,dy);if(ds>r)continue;let ci;
    if(ds>r-1.15)ci=0;else{const nx=dx/r,ny=dy/r,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));let l=(nx*L[0]+ny*L[1]+nz*L[2])/ln+(B[(i&1)+(j&1)*2]-1.5)*0.07;ci=l>0.93?4:l>0.62?3:l>0.2?2:1}
    x.fillStyle=P[ci];x.fillRect(i,j,1,1)}
  return ballCache[key]=c}
const bubCache={};
function bubSpr(r){r=Math.round(r);if(bubCache[r])return bubCache[r];const d=r*2+2,c=mk(d,d),x=c.getContext('2d'),o=r+1;
  for(let j=0;j<d;j++)for(let i=0;i<d;i++){const dx=i+0.5-o,dy=j+0.5-o,ds=Math.hypot(dx,dy);if(ds>r)continue;let col;
    if(ds>r-1.2)col='rgba(235,250,255,0.95)';else if(ds>r-2.4)col=(dx>0&&dy>0)?'rgba(255,140,220,0.6)':'rgba(140,230,255,0.6)';else col=((i+j)&1)?'rgba(150,225,255,0.12)':'rgba(150,225,255,0.26)';
    const a=Math.atan2(dy,dx);if(ds>r*0.62&&ds<r*0.8&&a>-2.6&&a<-1.7)col='rgba(255,255,255,0.95)';x.fillStyle=col;x.fillRect(i,j,1,1)}
  disc(x,o-r*0.45,o-r*0.5,Math.max(1,r*0.08|0),'#fff');return bubCache[r]=c}

/* ---------- фоны ---------- */
function groundStrip(x,top,base,dark,speck,seed){const r=mulberry(seed);rect(x,0,F,W,12,base);rect(x,0,F,W,2,top);
  for(let i=8;i<W;i+=16)rect(x,i,F+3,1,8,dark);for(let i=0;i<60;i++)rect(x,r()*W,F+3+r()*8,1,1,speck);rect(x,0,F+11,W,1,dark)}
function cloud(x,cx,cy,c='#ffffff',sh='#cfe6f7'){disc(x,cx-8,cy+3,5,sh);disc(x,cx+8,cy+3,5,sh);disc(x,cx-8,cy+2,5,c);disc(x,cx+8,cy+2,5,c);disc(x,cx,cy,7,c);disc(x,cx+4,cy-3,5,c);rect(x,cx-13,cy+5,27,3,sh)}
/* густая пальма: перистые листья */
function palm(x,bx,by,h,dir,r,big=1){let tx=bx,ty=by;
  for(let i=0;i<h;i++){const t=i/h;tx=bx+Math.round(Math.sin(t*1.3)*h*0.22*dir);ty=by-i;const w=Math.max(3,Math.round(6*big-t*2.5));
    rect(x,tx-(w>>1),ty,w,1,(i%6<3)?'#9a6a35':'#7a4f25');rect(x,tx-(w>>1),ty,1,1,'#4a2d14');if(i%6===0)rect(x,tx-(w>>1),ty,w,1,'#5a3818')}
  const frond=(a,len,c1,c2,c3)=>{let px=tx,py=ty;for(let s=0;s<len;s++){px=tx+Math.cos(a)*s;py=ty+Math.sin(a)*s*0.8+s*s*0.02;
      rect(x,px,py,2,2,c3);if(s>2&&s%2===0){const L=Math.round((1-s/len)*8*big+2);const sx=Math.cos(a)>0?1:-1;
        for(let k=1;k<=L;k++){rect(x,px-k*0.55*sx,py+k*0.9,1,1,k%3?c1:c2);rect(x,px+k*0.45*sx,py+k*1.0,1,1,k%3?c2:c1)}}}};
  const n=13;for(let i=0;i<n;i++){const a=-Math.PI-0.35+i*(Math.PI+0.7)/(n-1)+(r()-0.5)*0.15;frond(a,(18+r()*8)*big,'#1d6b2e','#165426','#0f4a20')}
  for(let i=0;i<n;i++){const a=-Math.PI-0.2+i*(Math.PI+0.4)/(n-1)+(r()-0.5)*0.2;frond(a,(15+r()*9)*big,'#3fbf4f','#2f9e44','#25803a')}
  for(const[dx,dy]of[[-3,3],[2,4],[-1,6],[4,1]])disc(x,tx+dx,ty+dy,2,'#5a3a1a');rect(x,tx-2,ty+2,1,1,'#8a6a3a')}
function cactus(x,cx,by,h){const c='#3f9b4a',d='#2a6b33',l='#6fd27a';rect(x,cx-3,by-h,7,h,c);rect(x,cx-3,by-h,2,h,l);rect(x,cx+3,by-h,1,h,d);rect(x,cx-9,by-h*0.65,6,4,c);rect(x,cx-9,by-h*0.65-8,4,10,c);rect(x,cx+4,by-h*0.5,5,4,c);rect(x,cx+6,by-h*0.5-10,4,12,c)}
function pine(x,cx,by,h){rect(x,cx-1,by-6,3,6,'#4a2d1a');for(let k=0;k<3;k++){const t=by-6-k*h*0.28,hw=h*0.32-k*3;tri(x,cx,t-h*0.4,t,hw,'#1f5a4a');for(let i=-(hw|0);i<=hw;i+=2)rect(x,cx+i,t-((Math.abs(i)<3)?1:0),1,1,'#eef6ff');tri(x,cx,t-h*0.4,t-h*0.25,3,'#eef6ff')}}
function building(x,bx,by,w,h,c,top,win,r,p){rect(x,bx,by-h,w,h,c);rect(x,bx,by-h,w,1,top);for(let yy=by-h+4;yy<by-4;yy+=5)for(let xx=bx+2;xx<bx+w-3;xx+=4)if(r()<p)rect(x,xx,yy,2,2,win)}

const SCENES=[
{name:'ПЛЯЖ',n2:'НОЧНОЙ ПЛЯЖ',en:['crab','jelly'],boss:'crab',balls:['red','purple'],bg:'#0d2a4a',tint:'#5a64c8',tr:0,
 draw(x,L){const r=mulberry(11),hz=Math.round(F*0.5),sea=Math.round(F*0.66);
  grad(x,0,hz,['#2a63c9','#3477d8','#4a8fe6','#68aaf0','#8cc5f5','#b6def7']);disc(x,128,hz*0.3,17,'#fff4b8');disc(x,128,hz*0.3,13,'#ffe36a');
  grad(x,hz,sea,['#1666a8','#1b7cbf','#2394cf','#3aaedb']);for(let i=0;i<60;i++)rect(x,r()*W,hz+1+r()*(sea-hz-2),2+r()*5,1,i%3?'#7fd0ee':'#d8f4ff');
  for(let y=hz+2;y<sea-2;y+=2)rect(x,120+r()*8,y,6+r()*8,1,'#fff1a0');rect(x,0,hz,W,1,'#9fe0ff');

function musStep(st,t,spb){const m=A.mus,s=st&15,bar=(st>>4)&3,tr=MUS.tr,mode=MUS.mode;
  if(mode===2){if(s%2===0)tone(mf(33+tr+(bar===3?3:0)+(s===6||s===14?12:0)),0,spb*1.5,'sawtooth',0.22,0,m,t);const n=BOSSL[st&31];if(n)tone(mf(n+tr),0,spb*1.6,'square',0.12,0,m,t);
    if(s%4===0)tone(150,40,0.15,'sine',0.8,0,m,t);if(s===4||s===12)noise(0.12,0.35,'bandpass',1800,900,0,m,t);noise(0.03,0.1,'highpass',7000,0,0,m,t);return}
  if(BASSP[s]!==undefined)tone(mf(ROOTS[bar]-12+BASSP[s]+tr),0,spb*1.7,'triangle',0.55,0,m,t);
  const Ld=((st>>6)&&mode===0)?LEAD2:LEAD,n=Ld[st&63];if(n){tone(mf(n+tr),0,spb*(mode===1?2.2:1.7),'square',mode===1?0.1:0.13,0,m,t);if(mode===0)tone(mf(n+tr+12),0,spb*0.9,'square',0.03,0,m,t+spb*0.5)}

function updBoss(dt){const b=boss,c=G.cfg,p=player;b.t+=dt;b.hitT-=dt;b.kn-=dt;b.sc=Math.min(1.75,1+b.t/45);const d=bossDims();const spd=20+G.L*1.2;

function updBossEnter(dt){if(boss&&boss.st==='enter'){const d=bossDims();boss.y+=200*dt;const ty=boss.k==='spider'||boss.k==='jelly'?TOPH+60:F-d.h/2;if(boss.y>=ty){boss.y=ty;boss.st='act';G.shake=0.3;S.bossRoar()}}}
function enemySprite(e){const s=EN[e.k].spr(e);return s[((G.t*(e.st==='walk'||e.st==='float'?8:4))|0)%2]}
function updEnemies(dt){const c=G.cfg,p=player;

function killEnemy(i){const e=ens[i];ens.splice(i,1);const pts=EN[e.k].pts;G.score+=pts;addPop(e.x,e.y-10,'+'+pts,'#8cf09a');S.squash();burst(e.x,e.y,['','#3a2440','#7dff5c','#2fc457','#9fe8ff'],14,false)}
function play(dt){const c=G.cfg,p=player;
  let dir=0;if(keys.left||keys.right){dir=(keys.right?1:0)-(keys.left?1:0);p.tx=null}else if(p.tx!=null){const dx=p.tx-p.x;if(Math.abs(dx)<1){p.tx=null}else dir=Math.sign(dx)}
  let mv=dir*100*dt;if(p.tx!=null&&Math.abs(mv)>Math.abs(p.tx-p.x))mv=p.tx-p.x;p.x=clamp(p.x+mv,9,W-9);p.moving=dir!==0;if(dir)p.face=dir;p.anim+=dt;
  if(!dir){let best=90,tx=null;if(boss&&boss.st==='act'){const d=Math.abs(boss.x-p.x);if(d<best+bossDims().w/2){best=d;tx=boss.x}}for(const e of ens){if(e.st!=='walk')continue;const d=Math.abs(e.x-p.x);if(d<best){best=d;tx=e.x}}if(tx!==null&&Math.abs(tx-p.x)>2)p.face=Math.sign(tx-p.x)}
  p.cool-=dt;p.inv-=dt;p.recoil-=dt;if(p.dbl>0)p.dbl-=dt;if(p.halo>0){p.halo-=dt;if(p.halo<=0)G.haloT=0}if(G.freeze>0)G.freeze-=dt;

  for(let i=jets.length-1;i>=0;i--){const j=jets[i];j.y-=400*dt;if(j.y<=TOPH){jets.splice(i,1);for(let k=0;k<5;k++)parts.push({x:j.x,y:TOPH+2,vx:rnd(-50,50),vy:rnd(0,60),l:0.4,c:'#bff3ff',g:300,s:1})}}

  for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.age+=dt;

  for(let ji=jets.length-1;ji>=0;ji--){const j=jets[ji];let hit=false;
    for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.esc>=0)continue;const r=RAD[b.s],cy=clamp(b.y,j.y,F),dx=b.x-j.x,dy=b.y-cy;if(dx*dx+dy*dy<(r+2)*(r+2)){popBall(i);hit=true;break}}
    if(!hit)for(let i=ens.length-1;i>=0;i--){const e=ens[i],m=EN[e.k];if(e.st==='dig')continue;if(Math.abs(e.x-j.x)<m.hw+(e.st==='walk'?10:2)&&e.y+m.hh>j.y&&e.y-m.hh<F){hit=true;e.hp--;if(e.hp<=0)killEnemy(i);else{S.armor();e.hit=0.15;addPop(e.x,e.y-12,'БРОНЯ','#ffb08a')}break}}

    for(const e of ens)burst(e.x,e.y,['','#fff','#9fe8ff','#fff','#9fe8ff'],6,false);ens=[];S.clear()}}

function updFx(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.rot!==undefined)p.rot+=dt*12;if(p.l<=0)parts.splice(i,1)}

  case'dying':G.stateT+=dt;player.vy+=520*dt;player.dy+=player.vy*dt;player.dx-=player.face*30*dt;player.rot+=dt*9*player.face;
    if(G.stateT>2.3){G.lives--;if(G.lives<=0){G.state='gameover';G.stateT=0;if(G.score>G.best)G.best=G.score;save();setMenu(goItems(),Math.round(H*0.55));musStop()}else startStage()}break;
  case'clear':G.stateT+=dt;for(let i=jets.length-1;i>=0;i--){jets[i].y-=400*dt;if(jets[i].y<=TOPH)jets.splice(i,1)}
    if(G.stateT>2.6){if(G.score>G.best){G.best=G.score;save()}
      if(G.g<4){G.g++;startStage()}else{G.state='gift';G.stateT=0;G.gifts[G.L]=true;G.unlocked=Math.max(G.unlocked,Math.min(LEVELS-1,G.L+1));save();musStop();S.gift()}}break;
  case'gift':G.stateT+=dt;if(G.stateT>1.2&&R()<0.5)parts.push({x:W/2+rnd(-20,20),y:H*0.42,vx:rnd(-90,90),vy:rnd(-200,-60),l:rnd(0.8,1.6),c:pick(['#ffd23f','#ff3fa4','#2a8cff','#5be35b','#fff']),g:200,s:2});break;
  case'win':G.stateT+=dt;if(R()<0.3)parts.push({x:rnd(0,W),y:-4,vx:rnd(-20,20),vy:rnd(20,60),l:4,c:pick(['#ffd23f','#ff3fa4','#2a8cff','#5be35b','#fff']),g:20,s:2});break;
  case'gameover':G.stateT+=dt;break}}

/* ---------- отрисовка ---------- */
function drawPlayer(){const p=player;if(!p)return;const fi=p.face>0?0:1;
  if(G.state==='dying'){ctx.save();ctx.translate(Math.round(p.x+p.dx),Math.round(F-13+p.dy));ctx.rotate(p.rot);ctx.drawImage(HERO.dead[fi],-9,-13);ctx.restore();return}
  if(p.inv>0&&G.state==='play'&&((G.t*12)|0)%2)return;
  let fr='stand',bob=0;if(p.moving&&G.state==='play'){fr=((p.anim*10)|0)%2?'run1':'run2';bob=((p.anim*10)|0)%2?-1:0}
  const sx=Math.round(p.x)-9,sy=F-HH+bob;rect(ctx,sx+3,F-1,12,2,'rgba(0,0,0,0.25)');
  const g=gunPos();ctx.drawImage(GUN,g.x,g.y+bob);ctx.drawImage(HERO[fr][fi],sx,sy);
  if(p.halo>0&&(p.halo>2||((G.t*10)|0)%2)){ctx.drawImage(HALO,sx+4,sy-6+Math.round(Math.sin(G.t*4)));
    for(let i=0;i<4;i++){const a=G.t*4+i*1.57;rect(ctx,p.x+Math.cos(a)*13,F-13+Math.sin(a)*15,2,2,i%2?'#ffe066':'#fff8c0')}
    ctx.globalAlpha=0.25+Math.sin(G.t*8)*0.1;disc(ctx,p.x,F-13,15,'#ffe066');ctx.globalAlpha=1}}
function drawJets(){for(const j of jets){const x0=Math.round(j.x)-2,y=Math.round(j.y),h=Math.round(F-HH+12-j.y);if(h<=0)continue;
  rect(ctx,x0-1,y,6,h,'rgba(40,140,255,0.35)');rect(ctx,x0,y,4,h,'#45b6ff');rect(ctx,x0+1,y,2,h,'#bdf0ff');
  for(let yy=y+2;yy<y+h;yy+=5){const o=(((yy+G.t*80)/5)|0)%3;rect(ctx,x0-1+o*2,yy,1,2,'#fff')}
  disc(ctx,j.x,y,3,'#45b6ff');disc(ctx,j.x,y,2,'#bdf0ff');rect(ctx,j.x-1,y-2,1,1,'#fff')}}
function drawContent(c,x,y){if(!c)return;x=Math.round(x);y=Math.round(y);
  if(c==='pine')ctx.drawImage(PINE,x-3,y-5);else if(c==='pow'){disc(ctx,x,y,4,'#fff');rect(ctx,x-1,y-3,2,4,'#2a8cff');rect(ctx,x-1,y+2,2,1,'#2a8cff')}
  else if(c==='halo'){ctx.drawImage(HALO,x-4,y-2);if(Math.sin(G.t*8)>0)rect(ctx,x-1,y-4,2,1,'#fff')}
  else if(c.startsWith('en:')){const k=c.slice(3);const s=(k==='crab'?CRAB:k==='cray'?CRAYR:k==='jelly'?JELLY:SPIDER)[((G.t*6)|0)%2];ctx.drawImage(s,x-(s.width>>1),y-(s.height>>1))}}
function drawBalls(list){for(const b of list){const r=RAD[b.s],s=ballSpr(b.s,b.col);
  if(b.esc>=0){const k=b.esc/0.6,sc=1+k*0.4,rr=r*sc;ctx.drawImage(s,Math.round(b.x-rr),Math.round(b.y-rr),Math.round(rr*2),Math.round(rr*2));ctx.globalAlpha=k;const br=(r+5)*(0.6+k*0.4);ctx.drawImage(bubSpr(br),Math.round(b.x-br-1),Math.round(b.y-br-1));ctx.globalAlpha=1;continue}
  if(b.c==='halo'){ctx.globalAlpha=0.35+Math.sin(G.t*6)*0.15;disc(ctx,b.x,b.y,r+4,'#ffe066');ctx.globalAlpha=1}
  ctx.drawImage(s,Math.round(b.x-r),Math.round(b.y-r));drawContent(b.c,b.x,b.y);
  if(G.freeze>0&&(G.freeze>1.5||((G.t*10)|0)%2)){ctx.globalAlpha=0.45;disc(ctx,b.x,b.y,r-1,'#c8f6ff');ctx.globalAlpha=1}}}
function drawItems(){for(const it of items){if(it.land&&it.t>4&&((G.t*10)|0)%2)continue;
  if(it.k==='pine')ctx.drawImage(PINE,Math.round(it.x-3),Math.round(it.y-5));
  else if(it.k==='halo'){ctx.globalAlpha=0.4;disc(ctx,it.x,it.y-2,8,'#ffe066');ctx.globalAlpha=1;ctx.drawImage(HALO,Math.round(it.x-4),Math.round(it.y-4))}
  else{const c=POWC[it.p];disc(ctx,it.x,it.y-1,6,'#1a1020');disc(ctx,it.x,it.y-1,5,c);ctx.drawImage(ICO[it.p],Math.round(it.x-3),Math.round(it.y-4))}}}
function drawEnemies(){for(const e of ens){if(e.k==='spider'&&e.st!=='walk')rect(ctx,e.x,TOPH,1,e.y-TOPH-2,'rgba(230,230,255,0.7)');const s=enemySprite(e);
  if(e.hit>0)ctx.globalAlpha=0.5;ctx.drawImage(s,Math.round(e.x-s.width/2),Math.round(e.y-s.height/2));ctx.globalAlpha=1}}
function drawBoss(){if(!boss)return;const b=boss,d=bossDims(),arr=b.k==='crab'?CRAB:b.k==='cray'?CRAY[b.face>0?0:1]:b.k==='jelly'?JELLY:SPIDER,s=arr[((G.t*(4+b.sc*2))|0)%2];
  if(b.k==='spider')rect(ctx,b.x,TOPH,1,b.y-d.h/2-TOPH,'rgba(230,230,255,0.8)');
  const bx=Math.round(b.x-d.w/2),by=Math.round(b.y-d.h/2),bw=Math.round(d.w),bh=Math.round(d.h);ctx.drawImage(s,bx,by,bw,bh);
  if(b.hitT>0){ctx.globalAlpha=0.55;ctx.filter='brightness(3)';ctx.drawImage(s,bx,by,bw,bh);ctx.filter='none';ctx.globalAlpha=1}
  ctx.drawImage(CROWN,Math.round(b.x-7),by-9,14,8)}
function drawBossBar(){if(!boss||boss.st!=='act')return;const y=TOPH+3;txt(BOSSN[boss.k],W/2,y,'#ff7d8a',8,'center');rect(ctx,20,y+11,W-40,5,'#1a1020');const w=Math.max(0,Math.round((W-42)*boss.hp/boss.max));rect(ctx,21,y+12,w,3,'#ff3b4a');rect(ctx,21,y+12,w,1,'#ff9aa0')}
function drawOverlays(){for(const o of overlays){const r=o.r,bs=ballSpr(o.s,o.col),br=RAD[o.s],oy=o.y+Math.sin(o.t*3)*2;ctx.globalAlpha=0.9;ctx.drawImage(bs,Math.round(o.x-br),Math.round(oy-br));ctx.globalAlpha=1;
  drawContent(o.c,o.x,oy);ctx.drawImage(bubSpr(r),Math.round(o.x-r-1),Math.round(o.y-r-1))}}
function drawParts(){for(const p of parts){if(p.img){ctx.save();ctx.translate(p.x|0,p.y|0);ctx.rotate(p.rot);ctx.drawImage(p.img,-6,-1);ctx.restore();continue}rect(ctx,p.x,p.y,p.s,p.s,p.c)}}
function drawPops(){for(const p of pops){ctx.globalAlpha=Math.min(1,p.l*2);txt(p.t,p.x,p.y,p.c,8,'center');ctx.globalAlpha=1}}
function drawGiftRow(yc){const pitch=8.5,x0=Math.round((W-(LEVELS-1)*pitch-7)/2);for(let i=0;i<LEVELS;i++){const x=Math.round(x0+i*pitch),y=Math.round(yc-3);
  ctx.drawImage(G.gifts[i]?GIFT_SPR[i]:GIFT_LOCK,x,y);if(i===G.L&&playing()&&((G.t*3)|0)%2)rect(ctx,x,y+8,7,1,'#ffd23f')}}
function drawHUD(){rect(ctx,0,0,W,TOPH,'#120c1f');rect(ctx,0,TOPH-1,W,1,'#4a3a7a');
  txt((G.L+1)+'-'+(G.g+1),2,4,'#ffd23f');for(let i=0;i<Math.min(G.lives,5);i++)ctx.drawImage(CAP,38+i*10,5);
  ctx.drawImage(PINE,72,3);txt(String(G.pines),81,4,'#ffd23f');txt(String(G.score).padStart(6,'0'),W-20,4,'#fff',8,'right');
  const pb=PAUSEB;rect(ctx,pb.x,pb.y,pb.w,pb.h,'#1a1020');rect(ctx,pb.x+1,pb.y+1,pb.w-2,pb.h-2,'#3e3168');rect(ctx,pb.x+5,pb.y+3,2,8,'#fff');rect(ctx,pb.x+9,pb.y+3,2,8,'#fff');
  const y0=F+12;rect(ctx,0,y0,W,H-y0,'#120c1f');rect(ctx,0,y0,W,1,'#4a3a7a');
  const c=G.cfg,fr=c?clamp(G.timeLeft/c.time,0,1):0;rect(ctx,2,y0+3,W-4,2,'#2a1f45');if(playing())rect(ctx,2,y0+3,Math.round((W-4)*fr),2,fr>0.5?'#4fd25f':fr>0.25?'#ffd23f':'#ff7d8a');
  txt('ПОДАРКИ',W/2,y0+7,'#7a6aa8',8,'center',null);drawGiftRow(y0+20);
  let px=4;const pw=[];if(player&&player.dbl>0)pw.push('dbl');if(G.freeze>0)pw.push('frz');for(const k of pw){disc(ctx,px+5,TOPH+8,5,POWC[k]);ctx.drawImage(ICO[k],px+2,TOPH+5);px+=13}}
function band(y,h){rect(ctx,0,y,W,h,'rgba(10,6,22,0.8)');rect(ctx,0,y,W,1,'#ff8a1f');rect(ctx,0,y+h-1,W,1,'#ff8a1f')}
function drawWorld(){ctx.drawImage(getBg(G.L),0,0);const S=scOf(G.L);if(S.anim){if(G.L>=10)ctx.globalAlpha=0.6;S.anim(ctx,G.t,S.data||{});ctx.globalAlpha=1}
  drawItems();drawJets();drawBalls(balls);drawEnemies();drawBoss();drawPlayer();drawParts();drawOverlays();drawBossBar();drawPops()}
function drawDots(y){for(let i=0;i<5;i++){const x=W/2-44+i*18;rect(ctx,x,y,12,12,'#1a1020');rect(ctx,x+1,y+1,10,10,i<G.g?'#4fd25f':i===G.g?'#ffd23f':'#3e3168');if(i===4)ctx.drawImage(CROWN,x+3,y+4,7,4)}}
function drawStateText(){const cy=Math.round(F*0.4);
  if(G.state==='intro'){band(cy-34,82);txt('УРОВЕНЬ '+(G.L+1),W/2,cy-28,'#ffd23f',8,'center');txt(lvlName(G.L),W/2,cy-15,'#fff',8,'center');
    drawDots(cy);txt('ИГРА '+(G.g+1)+' ИЗ 5',W/2,cy+18,'#9fe8ff',8,'center');
    if(G.cfg.boss)txt('БОСС!',W/2,cy+32,((G.t*6)|0)%2?'#ff3b4a':'#ff9aa0',8,'center');
    else txt(G.stateT<1.6?'ГОТОВ?':'ВПЕРЁД!',W/2,cy+32,G.stateT<1.6?'#fff':'#4fd25f',8,'center');
    if(G.L===0&&G.g===0){band(cy+60,46);txt('ТАПАЙ - БЕГИ',W/2,cy+65,'#fff',8,'center');txt('ПУЗЫРИ - ЛОПАЙ',W/2,cy+78,'#9fe8ff',8,'center');txt('БЕРЕГИСЬ ПАУКОВ!',W/2,cy+91,'#ff7d8a',8,'center')}}
  if(G.state==='clear'){band(cy-20,46);txt('ЧИСТО!',W/2,cy-14,'#4fd25f',16,'center');txt('ВРЕМЯ +'+G.bonus,W/2,cy+10,'#ffd23f',8,'center')}
  if(G.state==='dying'&&G.stateT>0.6){const m={spider:'УКУС ПАУКА!',crab:'ЩИПОК КРАБА!',cray:'СХВАТИЛ РАК!',jelly:'ОЖОГ МЕДУЗЫ!',boss:'БОСС ПОЙМАЛ!'}[G.reason]||'ОЙ!';band(cy-6,28);txt(m,W/2,cy+4,'#ff7d8a',8,'center')}
  if(G.hint>0&&G.state==='play'&&((G.t*4)|0)%4)txt('ТАПАЙ ПО ПУЗЫРЯМ!',W/2,TOPH+22,'#ff9be0',8,'center');
  if(G.state==='gameover'){rect(ctx,0,0,W,H,'rgba(10,6,22,0.75)');txt('ЖИЗНИ',W/2,H*0.18,'#ff3b4a',16,'center');txt('КОНЧИЛИСЬ',W/2,H*0.18+22,'#ff3b4a',16,'center');
    txt('УРОВЕНЬ '+(G.L+1)+' ИГРА '+(G.g+1),W/2,H*0.36,'#fff',8,'center');txt('СЧЁТ: '+G.score,W/2,H*0.36+14,'#fff',8,'center');txt('РЕКОРД: '+G.best,W/2,H*0.36+28,'#ffd23f',8,'center')}
  if(G.state==='gift'){rect(ctx,0,0,W,F+12,'rgba(10,6,22,0.8)');txt('УРОВЕНЬ '+(G.L+1),W/2,H*0.1,'#ffd23f',8,'center');txt('ПРОЙДЕН!',W/2,H*0.1+12,'#4fd25f',16,'center');
    const t=G.stateT,bx=W/2-28,by=Math.round(H*0.42)-28,sh=t<1.2?Math.round(Math.sin(t*40)*2*Math.min(1,t)):0,gs_=GIFT_SPR[G.L];
    if(t<1.2)ctx.drawImage(gs_,bx+sh,by,56,56);else{ditherDisc(ctx,W/2,by+22,16+Math.sin(t*5)*2,'#ffe066');ctx.drawImage(gs_,0,3,7,4,bx,by+24,56,32);const ly=by-Math.min(60,(t-1.2)*200);ctx.drawImage(gs_,0,0,7,3,bx,ly,56,24);
      txt('ПОДАРОК:',W/2,by+66,'#ffffff',8,'center');txt(GIFTS[G.L][0],W/2,by+80,GIFTS[G.L][1]==='#20202a'?'#ff3b4a':GIFTS[G.L][1],8,'center')}
    if(t>1.6&&((G.t*2)|0)%2)txt('ТАПНИ ДАЛЬШЕ',W/2,F-20,'#cfc6ff',8,'center')}
  if(G.state==='win'){rect(ctx,0,0,W,H,'rgba(10,6,22,0.8)');txt('ТЫ',W/2,H*0.12,'#ffd23f',16,'center');txt('ЛЕГЕНДА!',W/2,H*0.12+22,'#ffd23f',16,'center');
    txt('ВСЕ 20 УРОВНЕЙ',W/2,H*0.32,'#fff',8,'center');txt('СЧЁТ: '+G.score,W/2,H*0.32+14,'#4fd25f',8,'center');
    for(let i=0;i<LEVELS;i++)ctx.drawImage(GIFT_SPR[i],18+(i%5)*30,Math.round(H*0.45)+((i/5)|0)*22,14,14)}}
function drawTitle(){ctx.drawImage(getBg(0),0,0);SCENES[0].anim(ctx,G.t,{});rect(ctx,0,F+12,W,H-F-12,'#120c1f');drawBalls(titleBalls);rect(ctx,0,0,W,H,'rgba(10,6,30,0.3)');
  const ty=Math.round(H*0.06)+Math.round(Math.sin(G.t*2)*2);ctx.font='16px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';
  for(const[dx,dy]of[[-2,0],[2,0],[0,-2],[0,2],[2,2],[-2,2],[2,-2],[-2,-2],[0,4],[2,4],[-2,4]]){ctx.fillStyle=dy>=4?'#0a2a60':'#1a1020';ctx.fillText('SPLASH',W/2+dx,ty+dy);ctx.fillText('POP!',W/2+dx,ty+20+dy)}
  const gr=ctx.createLinearGradient(0,ty,0,ty+36);gr.addColorStop(0,'#fff6a8');gr.addColorStop(0.4,'#ffd23f');gr.addColorStop(0.55,'#ff8a1f');gr.addColorStop(1,'#ff3fa4');ctx.fillStyle=gr;ctx.fillText('SPLASH',W/2,ty);ctx.fillText('POP!',W/2,ty+20);
  const base=Math.round(H*0.2),hx=W/2-27,hy=base-Math.round(Math.abs(Math.sin(G.t*3))*5);rect(ctx,hx+8,base+77,40,3,'rgba(0,0,0,0.3)');
  for(let y=hy+30;y>hy-14;y-=4)rect(ctx,hx+50,y,4,2,y%8?'#9fe8ff':'#45b6ff');ctx.drawImage(GUN,hx+42,hy+33,18,30);ctx.drawImage(HERO.stand[0],hx,hy,54,78);
  ctx.drawImage(PINE,12,base+30,14,20);ctx.drawImage(CRAB[((G.t*6)|0)%2],W-38,base+56,26,18);ctx.drawImage(JELLY[((G.t*4)|0)%2],W-34,base+10,22,24);
  drawMenu();drawGiftRow(H-12);txt('РЕКОРД '+G.best,W/2,H-30,'#ffd23f',8,'center')}
function drawLevels(){ctx.drawImage(getBg(Math.min(G.unlocked,LEVELS-1)),0,0);rect(ctx,0,0,W,H,'rgba(10,6,22,0.78)');txt('УРОВНИ',W/2,14,'#ffd23f',16,'center');drawMenu();
  const sel=MENU.items[MENU.sel];if(sel&&sel.lv!==undefined)txt(lvlName(sel.lv),W/2,H-22,'#cfc6ff',8,'center')}
function render(){
  if(G.state==='title')drawTitle();else if(G.state==='levels')drawLevels();
  else{drawWorld();drawHUD();drawStateText();if(G.state==='gift'||G.state==='win')drawParts();if(G.flash>0)rect(ctx,0,0,W,F,'rgba(255,255,255,0.5)')}
  if(G.paused){rect(ctx,0,0,W,H,'rgba(10,6,22,0.7)');txt('ПАУЗА',W/2,H*0.18,'#ffd23f',16,'center')}
  if(MENU&&(G.paused||G.state==='gameover'||G.state==='win'))drawMenu();
  dctx.fillStyle=scOf(G.L).bg;dctx.fillRect(0,0,CW,CH);dctx.fillStyle='rgba(0,0,0,0.35)';const st=Math.max(4,Math.round(6*DPR));for(let y=0;y<CH;y+=st*2)dctx.fillRect(0,y,CW,st);
  let sx=0,sy=0;if(G.shake>0){sx=(R()-0.5)*6*gs*G.shake;sy=(R()-0.5)*6*gs*G.shake}
  dctx.imageSmoothingEnabled=false;dctx.drawImage(buf,0,0,W,H,Math.round(gx+sx),Math.round(gy+sy),Math.round(W*gs),Math.round(H*gs))}

/* ---------- цикл ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(frame)}
load();layout();toTitle();requestAnimationFrame(frame);
window.SPLASH={G,update,popOverlay,startFresh,startLevel,startStage,togglePause,openLevels,
  get player(){return player},get balls(){return balls},get ens(){return ens},get boss(){return boss},get overlays(){return overlays},get items(){return items}};
</script>
