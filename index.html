const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[ri(0,a.length-1)];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rect(x,a,b,w,h,c){x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),Math.max(0,Math.round(w)),Math.max(0,Math.round(h)))}
function disc(x,cx,cy,r,c){x.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);if(r<=0){x.fillRect(cx,cy,1,1);return}for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j+r*0.6));x.fillRect(cx-w,cy+j,w*2+1,1)}}
function ditherDisc(x,cx,cy,r,c){x.fillStyle=c;cx|=0;cy|=0;r|=0;for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j));for(let i=-w;i<=w;i++)if(((i+j)&1)===0)x.fillRect(cx+i,cy+j,1,1)}}
function grad(x,y0,y1,cols){const n=cols.length,hh=(y1-y0)/n;for(let i=0;i<n;i++){const a=Math.round(y0+i*hh),b=Math.round(y0+(i+1)*hh);x.fillStyle=cols[i];x.fillRect(0,a,W,b-a);if(i<n-1){x.fillStyle=cols[i+1];for(let yy=b-3;yy<b;yy++){const st=yy===b-1?2:4;for(let xx=(yy&1)*(st>>1);xx<W;xx+=st)x.fillRect(xx,yy,1,1)}}}}
function tri(x,cx,top,base,hw,c){x.fillStyle=c;top=Math.round(top);base=Math.round(base);for(let y=top;y<=base;y++){const w=Math.round((y-top)/Math.max(1,base-top)*hw);x.fillRect(Math.round(cx-w),y,w*2+1,1)}}
function mkSpr(rows,pal){const h=rows.length,w=Math.max(...rows.map(r=>r.length)),c=mk(w,h),x=c.getContext('2d');for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const col=pal[rows[j][i]];if(!col)continue;x.fillStyle=col;x.fillRect(i,j,1,1)}return c}
function flip(s){const c=mk(s.width,s.height),x=c.getContext('2d');x.translate(s.width,0);x.scale(-1,1);x.drawImage(s,0,0);return c}
const rev=s=>s.split('').reverse().join('');
const H2=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
function mix(a,b,t){const A=H2(a),B=H2(b);return'#'+A.map((v,i)=>clamp(Math.round(v+(B[i]-v)*t),0,255).toString(16).padStart(2,'0')).join('')}
function shade(hex,k){return k>1?mix(hex,'#ffffff',k-1):mix(hex,'#000000',1-k)}

function ballSpr(s,col){const key=s+col;if(ballCache[key])return ballCache[key];

  for(let j=0;j<d;j++)for(let i=0;i<d;i++){const dx=i+0.5-r,dy=j+0.5-r,ds=Math.hypot(dx,dy);if(ds>r)continue;let ci;
    if(ds>r-1.15)ci=0;else{const nx=dx/r,ny=dy/r,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));let l=(nx*L[0]+ny*L[1]+nz*L[2])/ln+(B[(i&1)+(j&1)*2]-1.5)*0.07;

    x.fillStyle=P[ci];x.fillRect(i,j,1,1)}
  return ballCache[key]=c}

function fog(x,c,a,y0=0,y1=F+12){x.globalAlpha=a;x.fillStyle=c;x.fillRect(0,Math.round(y0),W,Math.round(y1-y0));x.globalAlpha=1}
function cumulus(x,cx,cy,w,h,L,M,D,seed,n){const r=mulberry(seed);n=n||Math.round(w*h/70)+10;const bl=[];
  for(let i=0;i<n;i++){const t=Math.pow(r(),0.9);const rr=Math.max(3,Math.min(w*0.2,h*0.38)*(0.55+r()*0.55)*(1-t*0.35));const sp=(w*0.5-rr*0.6)*Math.sqrt(Math.max(0.04,1-t*t));
    bl.push([cx+(r()*2-1)*sp,cy+h*0.5-rr-t*(h-rr*1.8),rr])}
  for(const[a,b,c]of bl)disc(x,a+1,b+2,c,D);for(const[a,b,c]of bl)disc(x,a,b,c-1,M);for(const[a,b,c]of bl)disc(x,a-c*0.3,b-c*0.38,c*0.55,L)}
function flatCloud(x,cx,cy,w,c,sh){rect(x,cx-w/2,cy,w,2,c);rect(x,cx-w/2+3,cy-2,w-8,2,c);rect(x,cx-w/4,cy-4,w/3,2,c);if(sh)rect(x,cx-w/2+2,cy+2,w-4,1,sh)}

  for(let i=0;i<W;i++){const n=Math.sin(i*0.021*fq+o[0])*0.55+Math.sin(i*0.053*fq+o[1])*0.3+Math.sin(i*0.13*fq+o[2])*0.15;const yy=Math.round(y-amp*(n*0.5+0.5));rect(x,i,yy,1,y1-yy,col);if(lit)rect(x,i,yy,1,1,lit);prev=yy}}
function crags(x,y,amp,col,seed,fq=1,y1=F+12,lit){const r=mulberry(seed),o=[r()*9,r()*9];let prev=1e9;
  for(let i=0;i<W;i++){const n=(1-Math.abs(Math.sin(i*0.03*fq+o[0])))*0.72+(1-Math.abs(Math.sin(i*0.09*fq+o[1])))*0.28;const yy=Math.round(y-amp*n);rect(x,i,yy,1,y1-yy,col);if(lit&&yy<prev)rect(x,i,yy,1,3,lit);prev=yy}}

function fanPalm(x,bx,by,h,lean,tr,dk,lt,seed,sk){const r=mulberry(seed);let tx=bx,ty=by;
  for(let i=0;i<h;i++){const t=i/h;tx=Math.round(bx+lean*t*t*h*0.3);ty=by-i;rect(x,tx-1,ty,3,1,tr);if(i%4===0)rect(x,tx-1,ty,3,1,dk);if(t<0.05)rect(x,tx-2,ty,5,1,tr)}
  if(sk)for(let i=0;i<24;i++)rect(x,tx-3+r()*7,ty+3+r()*9,1,2+r()*4,sk);

  player={side:0,x:W/2,y:F,vy:0,ground:true,tx:null,ty:null,face:1,anim:0,cool:0.3,inv:1.5,dbl:0,fly:0,cannon:0,dx:0,dy:0,rot:0,moving:false,recoil:0,hp:MAXHP,kb:0};
  BV=HFR.map(h=>Math.sqrt(2*GRAV*h*(F-TOPH)));G.wingOut=false;G.wingStage=!c.boss&&c.d>=1&&R()<0.5;G.cannonOut=false;
  const S=scOf(G.L),n=c.sizes.length;c.sizes.forEach((s,i)=>{const b=newBall(s,W*(i+1)/(n+1),TOPH+36+(i%2)*20,i%2?-1:1,S.balls[i%2]);balls.push(b)});
  if(c.d>=3&&R()<0.5){const b=pick(balls);b.col='silver';b.hp=2}if(c.d>=7&&R()<0.35){const b=pick(balls);b.col='gold';b.hp=3}
  for(const b of balls)rollContent(b);
  if(c.boss){const k=S.boss,m=EN[k];boss={type:k,boss:1,x:m.g?W-30:W/2,y:TOPH-40,vx:0,vy:0,hp:c.bossHp,max:c.bossHp,t:0,sc:1,s:BK[k],hitT:0,kn:0,cd:2,st:'enter',spawnT:6,anchor:W/2,face:-1,dash:0,mode:null,mt:0};
    if(G.bossFails[G.L]>=4)giveCannonBall()}
  G.freeze=0;G.timeLeft=c.time;G.state='intro';G.stateT=0;G.refill=0;G.amb=rnd(6,10);
  if(c.boss)musStart(S.tr-5,140,2);else musStart(S.tr,116+(G.L%10)*3+(G.L>=10?8:0),0)}
function giveCannonBall(){if(G.cannonOut)return;G.cannonOut=true;const cand=balls.filter(b=>b.esc<0&&b.s<=2);let b=cand.find(b=>!b.c||!b.c.startsWith('en:'))||cand[0];
  if(!b){b=newBall(1,rnd(30,W-30),TOPH+20,R()<0.5?-1:1,scOf(G.L).balls[0]);balls.push(b)}b.c='cannon'}
function toTitle(){G.state='title';G.paused=false;setMenu(titleItems(),Math.round(H*0.55));musStart(-5,104,1);
  titleBalls=[newBall(0,40,60,1,'red'),newBall(1,140,50,-1,'gold'),newBall(2,90,90,1,'cyan')];BV=HFR.map(h=>Math.sqrt(2*GRAV*h*(F-TOPH)))}
function addPop(x,y,t,c='#fff'){pops.push({x:clamp(x,t.length*4+2,W-t.length*4-2),y,t,c,l:0.9})}
function burst(x,y,pal,n,water=true){for(let i=0;i<n;i++){const a=R()*6.283,sp=rnd(30,120);parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,l:rnd(0.3,0.7),c:pal[ri(1,4)],g:320,s:R()<0.3?2:1})}
  if(water)for(let i=0;i<6;i++)parts.push({x,y,vx:rnd(-60,60),vy:rnd(-120,-20),l:rnd(0.3,0.6),c:R()<0.5?'#9fe8ff':'#ffffff',g:380,s:1})}
function hurt(n,fx,why){const p=player;if(G.state!=='play'||p.inv>0||p.fly>0)return;p.hp-=n;p.inv=1.5;S.hurt();G.shake=0.25;G.flash=0.06;G.reason=why;
  for(let i=0;i<n;i++)parts.push({x:p.x,y:p.y-26,vx:rnd(-50,50),vy:-120,l:0.8,img:HEART,g:300,rot:0});
  if(fx!=null){p.kb=(p.x>=fx?1:-1)*150;if(p.ground){p.vy=-140;p.ground=false}}
  if(p.hp<=0){p.hp=0;die(why)}}
function die(why){G.state='dying';G.stateT=0;G.reason=why;player.vy=-240;player.rot=0;S.die();G.shake=0.45;G.flash=0.15;musHalt();
  if(G.cfg.boss){G.bossFails[G.L]++;save()}
  parts.push({x:player.x,y:player.y-18,vx:player.face*-70,vy:-200,l:2,img:GLASSES,g:500,rot:0})}

const keys={left:false,right:false,up:false,down:false};let gest=null;
let DPR=1,CWd=0,CHd=0,gs=1,gx=0,gy=0;
function setH(nh){if(nh===H)return;const dy=(nh-BOT-12)-F;H=nh;F=H-BOT-12;buf.height=H;ctx=buf.getContext('2d');ctx.imageSmoothingEnabled=false;
  for(const a of[balls,items,ens,overlays,titleBalls,parts,pops,drops,poops])for(const o of a){o.y+=dy;if(o.py!=null)o.py+=dy}if(boss)boss.y+=dy;if(player){player.y+=dy;if(player.ty!=null)player.ty+=dy}
  BV=HFR.map(h=>Math.sqrt(2*GRAV*h*(F-TOPH)));if(MENU&&G.state==='title')MENU.y0=Math.round(H*0.55)}
function layout(){DPR=Math.min(window.devicePixelRatio||1,3);const w=window.innerWidth,h=window.innerHeight;
  CWd=cv.width=Math.max(1,Math.round(w*DPR));CHd=cv.height=Math.max(1,Math.round(h*DPR));
  const asp=h/Math.max(1,w);setH(asp>1.15?clamp(Math.round(W*asp),300,400):320);
  gs=Math.min(CWd/W,CHd/H);gx=(CWd-W*gs)/2;gy=(CHd-H*gs)/2;dctx.imageSmoothingEnabled=false}
window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,250));
function toBuf(e){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*CWd/r.width,py=(e.clientY-r.top)*CHd/r.height;return{x:(px-gx)/gs,y:(py-gy)/gs}}
const inR=(p,r,e=4)=>p.x>=r.x-e&&p.x<=r.x+r.w+e&&p.y>=r.y-e&&p.y<=r.y+r.h+e;
const PAUSEB={x:W-17,y:1,w:16,h:14};
const playing=()=>['intro','play','clear','dying'].includes(G.state);
function setTarget(p){const pl=player;if(!pl)return;pl.tx=clamp(p.x,10,W-10);if(pl.fly>0)pl.ty=clamp(p.y+14,TOPH+30,F)}
function jump(){const p=player;if(p&&p.ground&&p.fly<=0&&G.state==='play'){p.vy=-250;p.ground=false;S.jump();for(let i=0;i<5;i++)parts.push({x:p.x+rnd(-5,5),y:F-1,vx:rnd(-30,30),vy:rnd(-30,-5),l:0.3,c:'#ffffff',g:100,s:1})}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();aInit();try{cv.focus()}catch(_){}const p=toBuf(e);
  if(G.paused||!playing()){uiTap(p);return}
  if(inR(p,PAUSEB,6)){togglePause();return}
  if(inR(p,wingBtn(),3)){useWings();return}
  if(G.state==='play'){for(let i=overlays.length-1;i>=0;i--){const o=overlays[i];if(Math.hypot(p.x-o.x,p.y-o.y)<o.r+8){popOverlay(i);return}}}
  if(!player||G.state==='dying')return;
  gest={id:e.pointerId,x:p.x,y:p.y,t:G.t,j:false};
  if(Math.abs(p.x-player.x)<13&&p.y>player.y-30&&p.y<player.y+6&&player.fly<=0){jump();gest.j=true;return}
  if(p.y>TOPH)setTarget(p)},{passive:false});
cv.addEventListener('pointermove',e=>{if(!gest||e.pointerId!==gest.id||!player)return;const p=toBuf(e);
  if(!gest.j&&gest.y-p.y>14&&G.t-gest.t<0.45&&player.fly<=0){gest.j=true;jump();return}
  if(!gest.j||player.fly>0)setTarget(p)});
const up=e=>{if(gest&&e.pointerId===gest.id)gest=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
['touchstart','touchend'].forEach(ev=>document.addEventListener(ev,e=>{aInit();if(e.cancelable)e.preventDefault()},{passive:false}));
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{aInit();const k=e.code;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter'].includes(k))e.preventDefault();
  if(MENU&&(G.paused||!playing())&&G.state!=='gift'){const n=MENU.items.length;
    if(k==='ArrowUp'||k==='KeyW'||(G.state==='levels'&&k==='ArrowLeft')){MENU.sel=(MENU.sel+n-1)%n;S.click()}
    else if(k==='ArrowDown'||k==='KeyS'||(G.state==='levels'&&k==='ArrowRight')){MENU.sel=(MENU.sel+1)%n;S.click()}
    else if((k==='Enter'||k==='Space')&&!e.repeat){S.click();MENU.items[MENU.sel].a()}
    else if((k==='Escape'||k==='KeyP')&&G.paused)togglePause();return}
  if(G.state==='gift'&&(k==='Enter'||k==='Space'))giftNext();
  if(k==='ArrowLeft'||k==='KeyA')keys.left=true;if(k==='ArrowRight'||k==='KeyD')keys.right=true;
  if(k==='ArrowUp'||k==='KeyW'||k==='Space'){keys.up=true;if(!e.repeat)jump()}if(k==='ArrowDown'||k==='KeyS')keys.down=true;
  if((k==='KeyE'||k==='KeyF')&&!e.repeat)useWings();if((k==='KeyP'||k==='Escape')&&!e.repeat)togglePause();if(k==='KeyM'&&!e.repeat)toggleAll()});
window.addEventListener('keyup',e=>{const k=e.code;if(k==='ArrowLeft'||k==='KeyA')keys.left=false;if(k==='ArrowRight'||k==='KeyD')keys.right=false;if(k==='ArrowUp'||k==='KeyW'||k==='Space')keys.up=false;if(k==='ArrowDown'||k==='KeyS')keys.down=false});
window.addEventListener('blur',()=>{keys.left=keys.right=keys.up=keys.down=false;gest=null;autoPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){autoPause();if(A.ctx)A.ctx.suspend()}else if(A.ctx&&!G.paused)A.ctx.resume()});
function autoPause(){if(!G.paused&&['intro','play','clear'].includes(G.state))togglePause()}
function toggleAll(){const on=!(A.musicOn||A.sfxOn);A.musicOn=A.sfxOn=on;applyVol();save()}
function togglePause(){if(!playing())return;
  if(G.paused){G.paused=false;MENU=null;if(A.ctx)A.ctx.resume();if(MUS.want&&G.state!=='dying')musStart(MUS.want.tr,MUS.want.bpm,MUS.want.mode)}
  else{G.paused=true;gest=null;keys.left=keys.right=false;musHalt();setMenu(pauseItems(),Math.round(H*0.32))}}
function uiTap(p){if(G.state==='gift'){giftNext();return}if(MENU)menuTap(p)}

/* ---------- меню ---------- */
let MENU=null;
function setMenu(items,y0,grid){MENU={items,sel:0,y0,rects:[],grid}}
const onoff=v=>v?'ВКЛ':'ВЫКЛ';
function titleItems(){const it=[];const cont=Math.min(G.unlocked,LEVELS-1);
  it.push({t:()=>cont>0?'ИГРАТЬ: УР '+(cont+1):'ИГРАТЬ',a:()=>startFresh(cont)});
  it.push({t:()=>'УРОВНИ',a:openLevels});it.push({t:()=>'ЗВУК: '+onoff(A.musicOn||A.sfxOn),a:()=>{toggleAll();aInit()}});return it}
function openLevels(){G.state='levels';const it=[];for(let i=0;i<LEVELS;i++)it.push({lv:i,t:()=>String(i+1),a:()=>{if(i<=G.unlocked)startFresh(i);else tone(200,150,0.1,'square',0.1)}});
  it.push({t:()=>'НАЗАД',a:toTitle});setMenu(it,40,true)}
function pauseItems(){return[{t:()=>'ПРОДОЛЖИТЬ',a:togglePause},{t:()=>'МУЗЫКА: '+onoff(A.musicOn),a:()=>{A.musicOn=!A.musicOn;applyVol();save()}},
  {t:()=>'ЗВУКИ: '+onoff(A.sfxOn),a:()=>{A.sfxOn=!A.sfxOn;applyVol();save()}},{t:()=>'В МЕНЮ',a:()=>{G.paused=false;toTitle()}}]}
function goItems(){return[{t:()=>'ЗАНОВО УРОВЕНЬ',a:()=>{G.score=G.lvlScore;startLevel(G.L)}},{t:()=>'В МЕНЮ',a:toTitle}]}
function menuTap(p){for(let i=0;i<MENU.rects.length;i++){if(inR(p,MENU.rects[i],2)){MENU.sel=i;S.click();MENU.items[i].a();return true}}return false}
function drawBtn(x,y,w,h,lab,sel,dis){rect(ctx,x+2,y+3,w,h,'rgba(0,0,0,0.45)');rect(ctx,x,y,w,h,'#1a1020');rect(ctx,x+1,y+1,w-2,h-2,dis?'#3a3448':sel?'#bff4ff':'#5a4a8c');rect(ctx,x+2,y+2,w-4,h-4,dis?'#2a2436':sel?'#2a9cf0':'#2e2350');rect(ctx,x+2,y+2,w-4,2,dis?'#2a2436':sel?'#6ac4ff':'#3e3168');if(lab)txt(lab,x+w/2,y+h/2-4,dis?'#6a6480':'#fff',8,'center')}
function drawMenu(){MENU.rects=[];let y=MENU.y0;
  if(MENU.grid){const cw=36,ch=34,x0=(W-4*cw-12)/2|0;
    MENU.items.forEach((it,i)=>{if(it.lv===undefined){const w=120,x=(W-w)/2|0,yy=y+5*(ch+4)+6;drawBtn(x,yy,w,20,it.t(),i===MENU.sel);MENU.rects.push({x,y:yy,w,h:20});return}
      const cx=x0+(i%4)*(cw+4),cy=y+((i/4)|0)*(ch+4),lock=it.lv>G.unlocked;drawBtn(cx,cy,cw,ch,null,i===MENU.sel,lock);
      txt(lock?'':String(it.lv+1),cx+cw/2,cy+5,'#fff',8,'center');
      if(lock){rect(ctx,cx+14,cy+14,9,7,'#6a6480');rect(ctx,cx+15,cy+10,7,5,'#6a6480');rect(ctx,cx+17,cy+12,3,3,'#2a2436')}
      else if(G.gifts[it.lv])ctx.drawImage(GIFT_ICONS[it.lv],cx+12,cy+17);else ctx.drawImage(GIFT_LOCK,cx+15,cy+20);MENU.rects.push({x:cx,y:cy,w:cw,h:ch})});return}
  MENU.items.forEach((it,i)=>{const lab=it.t(),w=Math.min(W-12,Math.max(130,lab.length*8+20)),x=(W-w)/2|0,h=20;drawBtn(x,y,w,h,lab,i===MENU.sel);MENU.rects.push({x,y,w,h});y+=h+6})}

/* =========================================================
   ИГРОВАЯ ЛОГИКА
   ========================================================= */
function sprOf(o){const m=EN[o.type];return(m.dir&&o.face<0)?m.sprL:m.spr}
function dims(o){const s=EN[o.type].spr[0],k=o.boss?o.s:1;return{w:s.width*k,h:s.height*k}}
function spawnItem(k,x,y,extra){items.push(Object.assign({k,x,y,vx:rnd(-30,30),vy:-110,t:0,land:false},extra||{}))}
function releaseContent(c,x,y){if(!c)return;
  if(c==='pine'||c==='coin'||c==='straw'||c==='wings'||c==='cannon')spawnItem(c,x,y);
  else if(c==='pow')spawnItem('pow',x,y,{p:pick(['dbl','frz'])});
  else if(c.startsWith('en:'))spawnEnemy(c.slice(3),x,y)}
function spawnEnemy(k,x,y){if(ens.length>=G.cfg.maxEn+(boss?2:0)){spawnItem('coin',x,y);return}
  const m=EN[k],e={type:k,x,y,vx:0,vy:0,t:0,turn:0,face:player&&player.x>x?1:-1,hp:m.hp,cd:m.cd?rnd(m.cd[0],m.cd[1]):rnd(0.8,1.4),hitT:0,dash:0,mode:null,mt:0,s:1};
  if(m.g)e.st=k==='spider'?'drop':'fall';else if(m.cross){e.mode='cross';e.y=TOPH+m.hy*(F-TOPH)+12}
  ens.push(e);S.enemy();addPop(x,y-10,'!','#ff4a4a')}
function spawnPigeon(){if(ens.length>=G.cfg.maxEn)return;const side=R()<0.5;ens.push({type:'pigeon',x:side?-10:W+10,y:TOPH+14,face:side?1:-1,mode:'cross',t:0,hp:2,cd:rnd(0.6,1.2),hitT:0,s:1})}
function popOverlay(i){const o=overlays[i];overlays.splice(i,1);G.score+=150;addPop(o.x,o.y-6,'+150','#bff6ff');S.bubble();
  for(let k=0;k<20;k++){const a=k/20*6.283;parts.push({x:o.x+Math.cos(a)*o.r,y:o.y+Math.sin(a)*o.r,vx:Math.cos(a)*rnd(40,90),vy:Math.sin(a)*rnd(40,90),l:rnd(0.25,0.5),c:k%3?'#e6faff':'#ff9be0',g:60,s:1})}
  burst(o.x,o.y,BALLC[o.col],6,false);releaseContent(o.c,o.x,o.y)}
function hitBall(i,dmg){const b=balls[i];b.hp-=dmg;if(b.hp>0){b.hitT=0.1;S.tink();for(let k=0;k<4;k++)parts.push({x:b.x+rnd(-4,4),y:b.y+RAD[b.s],vx:rnd(-40,40),vy:rnd(-60,0),l:0.25,c:'#ffffff',g:200,s:1});return}popBall(i)}
function popBall(i){const b=balls[i];balls.splice(i,1);const met=b.col==='gold'?3:b.col==='silver'?2:1,pts=PTS[b.s]*met;G.score+=pts;addPop(b.x,b.y-RAD[b.s]-4,'+'+pts,met>1?'#ffe070':'#fff');burst(b.x,b.y,BALLC[b.col],8+RAD[b.s]);S.pop(b.s);
  releaseContent(b.c,b.x,b.y);if(met>1)for(let k=0;k<met-1;k++)spawnItem('coin',b.x,b.y);
  if(b.s<3)for(const dir of[-1,1]){const nb=newBall(b.s+1,clamp(b.x+dir*RAD[b.s]*0.4,8,W-8),b.y,dir,b.col);nb.vy=-200;rollContent(nb);balls.push(nb)}}
function ballPhys(b,dt){b.vy+=GRAV*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;const r=RAD[b.s];
  if(b.y+r>=F){b.y=F-r;b.vy=-BV[b.s]}if(b.x-r<0){b.x=r;b.vx=Math.abs(b.vx)}if(b.x+r>W){b.x=W-r;b.vx=-Math.abs(b.vx)}if(b.y-r<TOPH){b.y=TOPH+r;b.vy=Math.abs(b.vy)}}
function gunPos(){const p=player,big=p.cannon>0,gw=big?8:6,sx=Math.round(p.x)-11,sy=Math.round(p.y)-CH_;return{x:p.face>0?sx+16:sx+CW_-16-gw,y:sy+(big?9:11)-(p.recoil>0?1:0),w:gw}}
function fire(x,y,dmg,w,str){const id=++streamId[str];
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.esc>=0)continue;const r=RAD[b.s];if(Math.abs(b.x-x)<r+w/2&&b.y+r>y&&b.y-r<player.y){hitBall(i,dmg);return}}
  drops.push({x,y,py:y,d:dmg,w,str,id})}
function hurtBoss(dmg,fromX){if(!boss)return;boss.hp-=dmg;boss.hitT=0.1;G.score+=10*dmg;S.bossHit();if(EN[boss.type].g&&boss.type!=='spider'){boss.kn=0.12;boss.vx=Math.sign(boss.x-fromX||1)*40}
  if(boss.hp<=0){const d=dims(boss);G.score+=5000;addPop(boss.x,boss.y-d.h/2,'+5000','#ffd23f');S.bossDie();G.shake=0.6;G.flash=0.2;
    for(let i=0;i<6;i++)burst(boss.x+rnd(-d.w/3,d.w/3),boss.y+rnd(-d.h/3,d.h/3),['','#ffd23f','#ff7a1a','#fff','#ff3b4a'],14,i%2===0);
    for(let i=0;i<6;i++)spawnItem('coin',boss.x+rnd(-10,10),boss.y);
    for(const e of ens)burst(e.x,e.y,['','#fff','#ffd23f','#9fe8ff','#fff'],8,false);ens=[];poops=[];boss=null;G.bossFails[G.L]=0;save()}}
function killEnemy(i){const e=ens[i];ens.splice(i,1);const pts=EN[e.type].pts;G.score+=pts;addPop(e.x,e.y-10,'+'+pts,'#8cf09a');S.squash();burst(e.x,e.y,['','#3a2440','#7dff5c','#2fc457','#9fe8ff'],14,false);if(R()<0.3)spawnItem('coin',e.x,e.y)}
function dropHits(d){const y0=d.y,y1=d.py+2;
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.esc>=0)continue;const r=RAD[b.s];if(Math.abs(b.x-d.x)<r+d.w/2&&b.y+r>=y0&&b.y-r<=y1){hitBall(i,d.d);return true}}
  for(let i=ens.length-1;i>=0;i--){const e=ens[i];if(e.st==='dig')continue;const s=dims(e);if(Math.abs(e.x-d.x)<s.w*0.45+d.w/2&&e.y+s.h/2>=y0&&e.y-s.h/2<=y1){e.hp-=d.d;e.hitT=0.1;if(e.hp<=0)killEnemy(i);else S.tink();return true}}
  if(boss&&boss.st==='act'){const s=dims(boss);if(Math.abs(boss.x-d.x)<s.w*0.45+d.w/2&&boss.y+s.h/2>=y0&&boss.y-s.h/2<=y1){hurtBoss(d.d,d.x);return true}}
  return false}
function sideHits(d){const x0=Math.min(d.px,d.x)-2,x1=Math.max(d.px,d.x)+2;
  for(let i=ens.length-1;i>=0;i--){const e=ens[i];if(e.st==='dig')continue;const s=dims(e);if(e.x+s.w*0.45>=x0&&e.x-s.w*0.45<=x1&&Math.abs(e.y-d.y)<s.h/2+3){e.hp-=d.d;e.hitT=0.1;if(e.hp<=0)killEnemy(i);else S.tink();splashAt(d);return true}}

  const gr=ctx.createLinearGradient(0,y,0,y+24);gr.addColorStop(0,'#ffffff');gr.addColorStop(0.35,'#9ff0ff');gr.addColorStop(0.55,'#3ab4ff');gr.addColorStop(1,'#1a5ad8');ctx.fillStyle=gr;ctx.fillText(T,W/2,y);
  for(let i=0;i<6;i++){const dx=26+i*26,dy=y+26+((G.t*24+i*11)%16);rect(ctx,dx,dy,2,3,'#9ff0ff');rect(ctx,dx,dy,1,1,'#ffffff')}}
function drawTitle(){ctx.drawImage(getBg(0),0,0);SCENES[0].anim(ctx,G.t,{});rect(ctx,0,F+12,W,H-F-12,'#120c1f');drawBalls(titleBalls);rect(ctx,0,0,W,H,'rgba(10,6,30,0.32)');
  drawLogo(Math.round(H*0.06)+Math.round(Math.sin(G.t*2)*2));txt('КОТ-МОДНИК ПРОТИВ ШАРОВ',W/2,Math.round(H*0.06)+46,'#ffe8b0',8,'center');
  const base=Math.round(H*0.24),hx=W/2-33,hy=base-Math.round(Math.abs(Math.sin(G.t*3))*5);rect(ctx,hx+12,base+74,40,3,'rgba(0,0,0,0.3)');
  for(let y=hy+30;y>hy-20;y-=3)rect(ctx,hx+52,y,6,2,y%6?'#9fe8ff':'#45b6ff');ctx.drawImage(GUN,hx+48,hy+33,18,30);ctx.drawImage(CAT.stand[0],hx,hy,66,72);
  ctx.drawImage(COIN[((G.t*6)|0)%2],12,base+20,12,14);ctx.drawImage(STRAW,14,base+44,14,16);ctx.drawImage(PIGEON[((G.t*6)|0)%2],W-40,base+2,24,18);ctx.drawImage(CRAB[((G.t*6)|0)%2],W-38,base+56,26,18);
  drawMenu();drawGiftRow(H-12);txt('РЕКОРД '+G.best,W/2,H-30,'#ffd23f',8,'center')}
function drawLevels(){ctx.drawImage(getBg(Math.min(G.unlocked,LEVELS-1)),0,0);rect(ctx,0,0,W,H,'rgba(10,6,22,0.78)');txt('УРОВНИ',W/2,14,'#3ad0ff',16,'center');drawMenu();
  const sel=MENU.items[MENU.sel];if(sel&&sel.lv!==undefined){txt(scOf(sel.lv).name,W/2,H-30,'#cfc6ff',8,'center');txt('БОСС: '+BOSSN[scOf(sel.lv).boss],W/2,H-18,'#ff9aa0',8,'center')}}
function render(){
  if(G.state==='title')drawTitle();else if(G.state==='levels')drawLevels();
  else{drawWorld();drawHUD();drawStateText();if(G.state==='gift'||G.state==='win')drawParts();if(G.flash>0)rect(ctx,0,0,W,F,'rgba(255,255,255,0.45)')}
  if(G.paused){rect(ctx,0,0,W,H,'rgba(10,6,22,0.7)');txt('ПАУЗА',W/2,H*0.18,'#3ad0ff',16,'center')}
  if(MENU&&(G.paused||G.state==='gameover'||G.state==='win'))drawMenu();
  dctx.fillStyle=scOf(G.L).bg;dctx.fillRect(0,0,CWd,CHd);dctx.fillStyle='rgba(0,0,0,0.35)';const st=Math.max(4,Math.round(6*DPR));for(let y=0;y<CHd;y+=st*2)dctx.fillRect(0,y,CWd,st);
  let sx=0,sy=0;if(G.shake>0){sx=(R()-0.5)*6*gs*G.shake;sy=(R()-0.5)*6*gs*G.shake}
  dctx.imageSmoothingEnabled=false;dctx.drawImage(buf,0,0,W,H,Math.round(gx+sx),Math.round(gy+sy),Math.round(W*gs),Math.round(H*gs))}

/* ---------- цикл ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(frame)}
load();layout();toTitle();requestAnimationFrame(frame);
window.SPLASH={useWings,G,update,render,popOverlay,startFresh,startLevel,startStage,togglePause,openLevels,jump,spawnEnemy,collect,getBg,
  get player(){return player},get balls(){return balls},get ens(){return ens},get boss(){return boss},get overlays(){return overlays},get items(){return items},get poops(){return poops}};
</script>
